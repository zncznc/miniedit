[package]
name = "miniedit-shell"
version = "1.5.0"
edition = "2021"
description = "MiniEdit 的 WebView2 外壳"

# 直接产出 MiniEdit.exe：安装包里就不用「改名」这一步，
# 没有改名也就不会出现「删不掉 → 要求重启」的提示
[[bin]]
name = "MiniEdit"
path = "src/main.rs"

[dependencies]
wry = { version = "0.47", features = ["devtools", "drag-drop"] }
tao = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
rfd = "0.15"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
winresource = "0.1"
