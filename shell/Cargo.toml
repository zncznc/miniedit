[package]
name = "miniedit-shell"
version = "1.4.1"
edition = "2021"
description = "MiniEdit 的 WebView2 外壳"

[dependencies]
wry = { version = "0.47", features = ["devtools", "drag-drop"] }
tao = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
rfd = "0.15"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
winresource = "0.1"
